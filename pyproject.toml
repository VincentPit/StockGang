[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "myquant"
version = "1.0.0"
description = "Institutional-grade quant trading platform with auto-update pipeline"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "httpx>=0.25",
    "akshare>=1.10",
    "yfinance>=0.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "lightgbm>=4.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "aiosqlite>=0.19",
    "aiofiles>=23.0",
]

[project.scripts]
myquant = "myquant.__main__:main"

[tool.setuptools.packages.find]
include = ["myquant*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "models", "data", "strategy", "risk", "execution", "portfolio", "backtest", "monitoring", "engine"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

[tool.coverage.run]
branch = true
source = ["api"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
