name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python tests ────────────────────────────────────────────────────────────
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet pytest-cov

      - name: Run test suite with coverage
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=api --cov=myquant \
            --cov-report=term-missing \
            --cov-report=xml

  # ── Python lint ─────────────────────────────────────────────────────────────
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install --quiet ruff

      - name: Lint api/ and tests/
        run: ruff check api/ tests/

      - name: Format check
        run: ruff format --check api/ tests/ myquant/

  # ── mypy (T3b) ───────────────────────────────────────────────────────────────
  # Scoped to the modules with the cleanest types first; expand the include-list
  # as more code is annotated. Strict mode stays off until coverage is broader.
  typecheck-py:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet mypy

      - name: Run mypy on focus areas
        run: |
          mypy --ignore-missing-imports --no-strict-optional \
            api/ \
            myquant/analytics/ \
            myquant/risk/ \
            myquant/scheduler.py \
            myquant/leader_lock.py \
            myquant/scheduler_main.py \
            myquant/workers/ \
            myquant/observability/

  # ── pip-audit (T3b) ──────────────────────────────────────────────────────────
  # Fails the build on HIGH or CRITICAL CVEs in our pinned dependencies.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit
        run: pip install --quiet pip-audit

      - name: Audit pinned deps
        run: pip-audit --requirement requirements.txt --strict --vulnerability-service osv

  # ── Bandit (T3b) — SAST for Python ───────────────────────────────────────────
  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: pip install --quiet bandit

      - name: Run bandit
        # -ll = high-or-medium severity; -ii = high-or-medium confidence.
        # Skip B101 (assert_used) — fine in tests; B104 (binding 0.0.0.0) is
        # the standard FastAPI dev binding.
        run: bandit -r api/ myquant/ -ll -ii --skip B101,B104

  # ── TypeScript type-check ────────────────────────────────────────────────────
  typecheck-web:
    name: tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

  # ── Docker build smoke test ──────────────────────────────────────────────────
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag myquant-api:ci .

      - name: Build web image
        run: docker build --tag myquant-web:ci ./web

  # ── Trivy image scan (T3c) ───────────────────────────────────────────────────
  trivy-scan:
    name: trivy
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Build API image (load into local Docker)
        run: docker build --tag myquant-api:ci .

      - name: Trivy — fail on HIGH or CRITICAL CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myquant-api:ci
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

  # ── npm audit (T3c) ──────────────────────────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Audit production deps (HIGH+)
        run: npm audit --omit=dev --audit-level=high
