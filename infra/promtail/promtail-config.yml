server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape all docker container stdout/stderr — Promtail labels each line
  # with the container name, image, and compose service so Grafana queries
  # like `{service="myquant_api"}` work out of the box.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: service
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
    pipeline_stages:
      # Try to parse JSON lines so Loki indexes level/logger/message as fields
      - json:
          expressions:
            level: level
            logger: logger
            message: message
      - labels:
          level:
