services:

  # ── TimescaleDB (PostgreSQL + time-series extension) ──────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: myquant_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       myquant
      POSTGRES_USER:     myquant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myquant"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: myquant_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Prometheus (T2a) ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: myquant_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Tempo — distributed tracing backend (T2c) ─────────────────────────────
  tempo:
    image: grafana/tempo:2.7.0
    container_name: myquant_tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./infra/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"     # Tempo HTTP query
      - "4317:4317"     # OTLP gRPC ingest

  # ── Loki — log aggregator (T2b) ───────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: myquant_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"
    healthcheck:
      disable: true

  # ── Promtail — tails docker container stdout, ships to Loki (T2b) ─────────
  promtail:
    image: grafana/promtail:latest
    container_name: myquant_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_started

  # ── Grafana Dashboard ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: myquant_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: myquant123
      GF_INSTALL_PLUGINS:         grafana-clock-panel
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      db:
        condition: service_healthy

  # ── Alembic migrations (one-shot) ─────────────────────────────────────────
  # Runs `alembic upgrade head` against the db service and exits. api/engine
  # depend on this completing successfully, so multi-replica deployments
  # never race the migration.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myquant_migrate
    command: alembic upgrade head
    environment:
      POSTGRES_HOST: db
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── Streamlit Live Dashboard ──────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myquant_dashboard
    restart: unless-stopped
    command: streamlit run myquant/monitoring/dashboard.py --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Trading Engine (paper mode) ───────────────────────────────────────────
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myquant_engine
    restart: unless-stopped
    command: python main.py
    environment:
      ENV:           paper
      REDIS_HOST:    redis
      POSTGRES_HOST: db
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
    healthcheck:
      disable: true

  # ── Cron scheduler (T1c) ──────────────────────────────────────────────────
  # Hosts APScheduler for daily data-refresh / retrain / weekly auto-tune.
  # Holds a Redis leader lock so even accidental scaling does not double-fire.
  # The API runs with SCHEDULER_IN_API=false — only this container schedules.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myquant_scheduler
    restart: unless-stopped
    command: python -m myquant.scheduler_main
    environment:
      REDIS_HOST:    redis
      POSTGRES_HOST: db
      LOG_LEVEL:     ${LOG_LEVEL:-INFO}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
    healthcheck:
      disable: true

  # ── Arq job worker (T1b) ──────────────────────────────────────────────────
  # Consumes Redis-queued jobs (backtest, screener, train, auto-tune, etc.).
  # Activated when MYQUANT_QUEUE=arq in the API env. Scale horizontally with
  # `docker compose up --scale worker=N`; jobs are claimed by whichever
  # worker pops them off the queue.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: arq myquant.workers.worker.WorkerSettings
    environment:
      MYQUANT_QUEUE: arq
      REDIS_HOST:    redis
      POSTGRES_HOST: db
      LOG_LEVEL:     ${LOG_LEVEL:-INFO}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
    healthcheck:
      disable: true

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myquant_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      LOG_LEVEL:          ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS:    ${ALLOWED_ORIGINS:-http://localhost:3000}
      SCHEDULER_ENABLED:  ${SCHEDULER_ENABLED:-true}
      SCHEDULER_IN_API:   "false"
      POSTGRES_HOST:      db
      REDIS_HOST:         redis
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Next.js frontend ───────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://api:8000
    container_name: myquant_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-side: Next.js rewrites proxy to the api container
      API_BASE_URL:        http://api:8000
      # Client-side: browser JS calls the API through the host port
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
  redisdata:
  grafanadata:
  prometheusdata:
  lokidata:
  tempodata:
